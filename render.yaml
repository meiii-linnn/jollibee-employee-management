services:
  - type: web
    name: jollibee-employee-management
    env: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jollibee-db
          property: connectionString

databases:
  - name: jollibee-db
    databaseName: jollibee
    user: jollibee_user
    plan: free
